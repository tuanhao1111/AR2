<style>
  model-viewer { 
    width: 1928px; 
    height: 1080px; 
    /* background-color: #eee;  <-- Có thể bỏ dòng này vì ta dùng skybox */
  }
</style>

<model-viewer 
  src="https://raw.githubusercontent.com/tuanhao1111/AR2/main/test2.glb"

  ar-modes="webxr scene-viewer quick-look" 
  camera-controls

  <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
